version: '3.8'

services:

  jwt-service:
    build:
      context: ./jwt-service
      dockerfile: Dockerfile
    depends_on:
      - postgres
    ports:
      - "8009:8009"

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - jwt-service
    ports:
      - "8010:8010"

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - jwt-service
    ports:
      - "8008:8008"

  project-service:
    build:
      context: ./project-service
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - jwt-service
    ports:
      - "8012:8012"

  postgres:
    image: postgres:alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    #      - ./postgres/schema/create.sql:/docker-entrypoint-initdb.d/create.sql скрипты, которые выполнятся с самого начала. они есть?
    restart: always
    env_file:
      - ./postgres/.env
    ports:
      - "5433:5432"

  node:
    image: 'node:20-alpine'
    restart: always
    ports:
      - "80:3000"
    working_dir: /var/www/front
    command: sh -c "npm install && npm run start"
    volumes:
      - ./frontend-crm:/var/www/front
    tty: true
    container_name: frontend

volumes:
  postgres_data:

